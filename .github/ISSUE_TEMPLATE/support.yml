name: Marble Bloom support request
description: Report a gameplay or technical problem without including personal information.
title: "Support: "
labels: ["support"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Marble Bloom. **Do not include a child's name, photo, location, school, email address, or other personal information.**
  - type: input
    id: device
    attributes:
      label: Device model
      description: For example, iPhone 14 or iPad (10th generation).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: iOS / iPadOS version
      placeholder: "26.x"
    validations:
      required: true
  - type: input
    id: garden
    attributes:
      label: Garden number
      description: Enter 1–10, or "startup" if the problem happens before play.
    validations:
      required: true  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead. Do not include personal information.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included a child's personal information in this report.
          required: true